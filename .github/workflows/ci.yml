name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv et Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Installer les outils multimédias
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg mkvtoolnix

      - name: Installer le projet
        run: uv sync --locked --group dev

      - name: Tester
        run: uv run pytest

      - name: Vérifier le style
        run: uv run ruff check .

      - name: Vérifier les types
        run: uv run pyright

      - name: Construire la distribution
        run: uv build
