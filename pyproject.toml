[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie"
version = "0.2.0"
description = "Numérisation DVD et conversion multimédia fiables et interactives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.405,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
]

[project.scripts]
movie = "movie.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
